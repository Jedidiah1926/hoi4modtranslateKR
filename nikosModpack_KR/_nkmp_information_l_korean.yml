  nkmp_contribute_cat_desc:0 "\n수년간 이 프로젝트를 응원해 주신 모든 분께 특별한 감사를 전합니다.\n\n코더 - §ONiko, Lord of Cloud Burning§!\n\n번역가 - §OPosion, Lord of Cloud Burning, Baka 외 여러분§!\n\n테스터 - §ONiko, Lord of Cloud Burning, Vekstovios§!\n\nKo-Fi - §ORobm95_§!\n\n그리고 마지막으로, §O당신§!. 당신이 없었다면 이 모드도 존재하지 않았을 겁니다. §R<3§!"
  nkmp_close_contribute:0 "닫기"
