# ==========================================================================
# General Information
# ==========================================================================
  nkmp_about_loc_key:0 "\nNikos's Modpack (Formely Ultimate Cheat Mod) has been around since February 2018. The mod dates back to before update 1.5.0 (Waking the Tiger). In this new Improved Version, which was introduced in 2019, the mod continues to grow every day.\n\nI wish to say thank you to all of those who have been around since the beginning and those who are just joining. Much §t~love~§! to all of you.\n\n§2Some FAQ§! - §RPlease Read All of them§!\n\n - If you see text that is in red §R(This color)§! then you must read the description when hovering over it to be warned of potential issues.\n\n- You should always hover over the mod and read the description before using it.\n\n- Reloading your game or your save may turn things off. You might have to enable them again. Be sure to check everything on a reload.\n\n- The Mod will say which overhaul mode it is in. If it detects one of my sub-mods, it will switch to it. Otherwise, it will say Default.\n\n- If you have any other issues, please report them on the Steam Workshop page.\n"
  nkmp_mod_version_loc_key:0 "Modpack Version - §C5.3.0§!"
  nkmp_last_update_loc_key:0 "Last Update - §G9/13/2026§!"
  nkmp_warning_loc_key:0 "§R- Read Description§!"
  nkmp_state_warn_loc_key:0 "§RUsing any of the state editor mods may cause lag due to the amount of states it may show. Be cautious with it.§!\n\n§RBe sure to read the descriptions to know how to use the mods.§!"
  nkmp_close_loc_key:0 "Click to hide this menu."

