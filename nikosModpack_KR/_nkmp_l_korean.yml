# ==========================================================================
# Quick Menu
# ==========================================================================
  nkmp_quickmenu_core_all:0 "보유한 모든 주 코어화"
  nkmp_quickmenu_core_all_desc:0 "보유하고 있지만 코어가 아닌 주가 있다면 이 결정으로 코어화합니다. 결정이 회색으로 비활성화되어 있다면 이미 통제 중인 모든 주가 코어라는 뜻입니다. \n\n§C보유한 주에만 작동합니다. 전쟁으로 통제 중인 주에는 작동하지 않습니다. \n\n[nkmp_mods_vassals_mode]"
  nkmp_quickmenu_max_all_inf:0 "보유한 모든 주 인프라 최대화"
  nkmp_quickmenu_max_all_inf_desc:0 "\n§C보유한 주에만 작동합니다. 전쟁으로 통제 중인 주에는 작동하지 않습니다. \n\n주 내부의 주요 철도도 최대로 올립니다. \n\n[nkmp_mods_vassals_mode]"
  nkmp_quickmenu_increase_world_tension_10:0 "세계 긴장도 10 추가"
  nkmp_quickmenu_decrease_world_tension_10:0 "세계 긴장도 10 감소"
  nkmp_quickmenu_increase_world_tension_50:0 "세계 긴장도 50 추가"
  nkmp_quickmenu_decrease_world_tension_50:0 "세계 긴장도 50 감소"
  nkmp_quickmenu_enable_puppet_ai:0 "괴뢰국 AI 모드 활성화"
  nkmp_quickmenu_enable_puppet_ai_desc:0 "종속국이 일부 모드를 사용할 수 있게 합니다.\n\n§R기본값은 꺼져 있습니다. 이 설정을 켜더라도 AI는 아래에 명시된 옵션만 사용합니다.§!\n\n§YAI 종속국이 사용하는 옵션은 다음과 같습니다:§!§C\n코어화\n인프라\n건물 슬롯§!"
  nkmp_quickmenu_disable_puppet_ai:0 "괴뢰국 AI 모드 비활성화"
  nkmp_quickmenu_disable_puppet_ai_desc:0 "괴뢰국이 일부 옵션을 사용하는 기능을 끕니다."
  nkmp_puppet_ai_disabled:0 "괴뢰국 모드 비활성화됨"
  nkmp_infrastructure_state:0 "모드 인프라"
  nkmp_infrastructure_state_flag:0 "아직 니코의 모드팩으로 인프라 최대화를 받지 않았습니다."
  nkmp_add_building_slots:0 "건물 슬롯 추가"
  nkmp_add_building_slots_desc:0 "게임의 최대 건물 슬롯 수에 도달할 때까지 건물 슬롯을 1000개씩 추가하려고 시도합니다. 게임의 최대 건물 슬롯 수는 다른 모드로 변경할 수 있습니다.\n\n§Y게임의 건물 슬롯 한도를 늘리려면 별도의 모드가 필요합니다. 해당 대규모 오버홀 모드에 맞게 설정 파일이 설계되지 않으면 모든 것과 충돌하기 때문입니다.\n\n§C보유한 주에만 작동합니다. 전쟁으로 통제 중인 주에는 작동하지 않습니다. \n\n[nkmp_mods_vassals_mode]"
  nkmp_building_slot:0 "모드 건물 슬롯"
  nkmp_building_slot_flag:0 "아직 니코의 모드팩으로 추가 건물 슬롯을 받지 않았습니다."
  nkmp_quickmenu_enable_nikos_preset:0 "§G활성화§! §C니코의 프리셋§!"
  nkmp_quickmenu_enable_nikos_preset_desc:0 "\n§Y제가 거의 모든 세이브에서 쓰는 커스텀 프리셋을 활성화합니다.§!\n\n§R경고: 켜진 일부 설정은 나중에 프리셋을 제거해도 되돌려지지 않습니다.§!"
  nkmp_quickmenu_disable_nikos_preset:0 "§R비활성화§! §C니코의 프리셋§!"

