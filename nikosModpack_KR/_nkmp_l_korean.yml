  nkmp_add_building_slots:0 "Add Building Slots"
  nkmp_add_building_slots_desc:0 "This descision will try to add 1000 building slots until you reach the games max amount of building slots. The games max amount of building slots can be changed with other mods.\n\n§YThe reason you require a separate mod to increase the games limit of building slots is because this will cause conflicts with everything unless the config files are specifically designed for that total overhaul mod.\n\n§CThis only works for states that you own. This will not work for any states that are controlled in a war. \n\n[nkmp_mods_vassals_mode]"
