 RULE_KSR_REICHSKOMMISSARIATS: "KSR 제국판무관부"
 RULE_KSR_REICHSKOMMISSARIATS_ENABLED_DESC: "KSR의 독일 제국판무관부, 제국보호령 및 기타 관련 종속국이 바닐라의 대응 국가를 대체합니다."
 RULE_KSR_REICHSKOMMISSARIATS_DISABLED_DESC: "바닐라의 제국판무관부, 제국보호령 및 기타 관련 종속국이 유지됩니다."
 
 RULE_UNCENSORED_NSDAP_SYMBOLS: "검열되지 않은 NSDAP 상징"
 RULE_UNCENSORED_NSDAP_SYMBOLS_ENABLED_DESC: "독일 제국과 그 종속국이 부정확한 바닐라 전쟁기 대신 하켄크로이츠 깃발 같은 역사적 상징을 사용합니다."
 RULE_UNCENSORED_NSDAP_SYMBOLS_DISABLED_DESC: "독일 제국과 그 종속국이 역사적인 하켄크로이츠 깃발 대신 바닐라 전쟁기 같은 검열된 상징을 사용합니다."
 
