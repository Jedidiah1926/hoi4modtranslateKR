 ksr.68.t:0 "우크라이나 제국판무관부"
 ksr.68.desc:0 "우크라이나인들은 양쪽에서 러시아와 폴란드의 압제자들과 역사적인 갈등을 겪어 왔다. 우리는 군사적으로나 이념적으로 단일 전선을 구축하고, 우크라이나가 [GER.GetNameDef]의 노선을 따르기를 바라야 한다."
