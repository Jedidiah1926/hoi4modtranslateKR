 ksr.138.t:0 "이탈리아 제국판무관부"
 ksr.138.desc:0 "남쪽의 이탈리아는 믿을 수 없는 동맹이라는 것을 거듭 증명해 왔으며, 대전쟁이 발발했을 때 이를 여실히 보여 주었다. 이제 이탈리아의 통치를 우리 손에 넣고, 마침내 순종적인 동맹을 가질 때가 된 것 같다."
