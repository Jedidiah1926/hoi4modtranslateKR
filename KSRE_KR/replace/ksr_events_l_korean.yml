 ksr.142.t:0 "[FROM.GetNameDef], 완전한 통제권 요구"
 ksr.142.desc:0 "[FROM.GetLeader]이(가) 전쟁을 계기로 [THIS.GetNameDef]의 통치권을 자신들에게 넘기라고 요구하는 메시지를 보내왔다.\n\n모든 주권을 완전히 넘겨줄 수도 있고, 그들의 비호 아래 일정한 자치를 누리는 데 동의할 수도 있다."
 ksr.142.a:0 "전쟁 수행을 위해 완전한 복속이 필요하다."
 ksr.142.b:0 "그들과 나란히 싸우겠다."
 
 ksr.143.t:0 "[SND.GetName], 붕괴 직전"
 ksr.143.desc:0 "[SND.GetNameDef]의 [SND.GetLeader]이(가) 무너져 가는 국가를 틈타 군대를 버리거나 일본에 투항할 계획을 세우고 있다는 의심이 든다. 일본이 산둥을 먼저 점령하면 그들이 이 지역을 차지하기가 훨씬 쉬워진다.\n\n이를 막으려면 [SND.GetNameDef]에 최후통첩을 보내 즉시 [CHI.GetNameDef]에 복속하라고 명령해야 한다."
 ksr.143.a:0 "최후통첩을 보낸다."
 ksr.143.b:0 "내버려 둔다. 아직 버틸지도 모른다."
 
 ksr.144.t: "훌치너 렌트헨 문제"
 ksr.144.desc: "훌치너 렌트헨은 1920년 2월 4일 체코슬로바키아에 부당하게 넘어간 우리의 옛 제국 영토다. 주민 투표도 없었고 누구에게도 의견을 묻지 않았다. 고문들은 [1727.OWNER.GetNameDef]에 대해 교환과 위협이라는 두 가지 방안을 내놓았다.\n\n교환을 택한다면 공공 부문 산업 시설 하나를 넘겨주겠다고 제안할 수 있으며, 그러면 그들이 받아들일 가능성이 높아진다. 다만 그들이 받아들이지 않으면 우리는 선의로 물러서며 영유권 주장을 포기하게 된다.\n\n전쟁으로 위협할 수도 있다. 이는 똑같이 효과적이면서 비용은 더 적을 수 있지만, 우리의 군사력이 가장 중요한 요소가 된다. 또한 그들이 받아들이지 않으면 전쟁을 할지 물러설지 검토하게 된다."
 ksr.144.a: "교환을 제안한다."
 ksr.144.a.tt1: "그들이 받아들일 의향은 다음 요소에 달려 있습니다: §Y같은 동맹, 같은 이념, 우리에 대한 그들의 호감도, 그들에 대한 우리의 독립 보장§!. 각 요소는 기본 최소치 35%에서 가능성을 15%씩 높입니다. 현재 수락 의향: [?KSR_var_hlucinsko_willingness|Y.0%%]."
 ksr.144.a.tt2: " \n그들이 §G수락하면:§!"
 ksr.144.a.tt3: " \n그들이 §R거절하면:§!"
 ksr.144.b: "전쟁으로 위협한다."
 ksr.144.c: "이 영토는 필요 없다."
 ksr.144.d: "§L취소§!"
 
 ksr.145.t: "[FROM.GetName], [1727.GetName] 교환 제안"
 ksr.145.desc: "[ROOT.GetNameDef] 주재 [FROM.GetAdjective] 대사가 최근 [FROM.capital.GetCapitalVictoryPointName]에서 보낸, 작은 영토 [1727.GetName]에 대한 교환 제안을 전해 왔다. 그들은 자신들의 옛 제국 영토를 돌려받는 대가로 국영 산업 기업 하나를 우리나라로 이전해 주겠다고 한다.\n\n[FROM.GetName]은(는) 아무런 공격적인 기색을 보이지 않으며, 우리가 어떤 결정을 내리든 받아들이고 필요하다면 역사적 영유권 주장도 포기하겠다고 한다.\n\n제안은 합리적으로 보이지만, [1727.GetName]은(는) 독일이 대전쟁에서 패한 직접적인 결과로 우리가 물려받은 곳이다. 이 땅을 돌려주면 [FROM.GetNameDef]이(가) 앞으로 더 큰 영토적 야망을 품게 될 수도 있다."
 ksr.145.a: "베르사유는 우리 알 바 아니다. 받아들인다."
 ksr.145.b: "우리 영토를 거래하지 않겠다."
 
 ksr.146.t: "[FROM.GetName], 우리의 제안 수락"
 ksr.146.desc: "[FROM.GetAdjective] 정부가 [1727.GetName]에 대한 우리의 제안을 받아들여 이 영토를 우리에게 넘겨주었다. 그 대가로 우리 국영 산업 기업 하나가 [FROM.GetNameDef](으)로 차근차근 이전되고 있다.\n\n이 작은 실레지아 지역의 국경이 마침내 바로잡혔다. 베르사유 조약의 잘못이 하루하루 되돌려지고 있다."
 ksr.146.a: "외교가 통했다. [1727.GetName]이(가) 돌아왔다."
 
 ksr.147.t: "[FROM.GetName], 우리의 제안 거절"
 ksr.147.desc: "[1727.GetName]에 대한 우리의 교환 제안이 안타깝게도 [FROM.GetAdjective] 정부에 의해 거절되었다. 아쉽지만 더 먼 미래에 이 영토를 되찾을 수 있을지도 모른다."
 ksr.147.a: "외교는 잘못된 선택이었을지도..."
 
 ksr.148.t: "[FROM.GetName], [1727.GetName] 요구"
 ksr.148.desc: "최근 우리 행정부는 [FROM.GetNameDef](으)로부터 [1727.GetName]을(를) 즉시 반환하지 않으면 직접적인 군사 충돌도 불사하겠다는 최후통첩을 받았다. [FROM.GetAdjective] 정부는 베르사유 조약 이후 잃은 영토를 되찾으려 하는 것으로 보이며, 이 작은 지역은 1920년 독일이 잃은 뒤 우리가 물려받은 곳이다.\n\n고문들은 이 문제가 사라지지 않을 것이므로 가만히 있지 말고 충돌에 대비하라고 촉구하고 있다. 그러나 [FROM.GetNameDef]와(과)의 직접적인 전쟁은 매우 힘들 수 있으며, 현재의 지정학적 상황은 우리가 합리적으로 행동해야 함을 시사한다. [1727.GetName]은(는) 주로 독일계 주민이 사는 땅이며, 우리 국민은 문화적으로도 낯선 작은 국경 지역을 두고 대규모 전쟁을 치를 준비가 되어 있지 않을 수 있다.\n\n[FROM.GetAdjective] 측의 최후통첩에 어떻게 대응할까?"
 ksr.148.a: "넘겨준다. 전쟁을 할 만한 가치는 없다."
 ksr.148.b: "절대 안 된다. 군을 동원하라."
 
 ksr.149.t: "[FROM.GetName], 우리의 최후통첩 수락"
 ksr.149.desc: "[FROM.GetAdjective] 정부가 [1727.GetName]을(를) 우리에게 넘기고 자국 영토에서 제외했다. 그들은 전쟁의 위협을 심각하게 받아들인 것으로 보이며, 그 덕분에 [1727.GetName]은(는) 총 한 발 쏘지 않고 [ROOT.GetAdjective]의 영토가 되었다."
 ksr.149.a: "약골들과 협상할 필요가 뭐 있나?"
 
 ksr.150.t: "[FROM.GetName], 우리의 최후통첩 거절"
 ksr.150.desc: "[FROM.GetAdjective] 측이 우리의 최후통첩을 거절했다. 이렇게 작은 지역을 두고 전쟁도 불사하겠다니 조금 놀랍지만, 우리도 그만큼 이에 대비해 왔다."
 ksr.150.a: "그렇다면 전쟁이다. 무력으로 빼앗을 때다."
 ksr.150.b: "그들이 우리 엄포를 간파했다. 물러설 때다."