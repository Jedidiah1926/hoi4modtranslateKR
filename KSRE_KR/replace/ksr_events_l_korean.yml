 ksr.135.desc:0 "옛 프랑스 식민 제국은 오랫동안 신대륙에서 번영했지만, 영국의 부상과 마침내 미합중국의 탄생으로 세계의 세력 판도가 바뀌면서 한때 강대했던 프랑스는 루이지애나 영토를 미국에 팔아넘겼다. 그러나 우리는 이 식민지를 다시 세움으로써 아메리카에 대한 옛 식민지 영유권을 되살릴 수 있다."
