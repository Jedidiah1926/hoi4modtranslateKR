 ksr.53.t:0 "네덜란드 제국판무관부"
 ksr.53.desc:0 "네덜란드인은 언제나 중요한 교역 상대였으며, 영국인들이 그들을 설득해 우리가 아닌 자신들과 손잡게 하던 시절은 끝났다. 이제 암스테르담이 [GER.GetNameDef]와(과) 긴밀히 보조를 맞추도록 해야 할 때다."
