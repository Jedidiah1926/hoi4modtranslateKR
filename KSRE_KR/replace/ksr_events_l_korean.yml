 ksr.110.t:0 "북아메리카 분할 계획 이행"
 ksr.110.desc:0 "협상 테이블 건너편의 서명 당사국이 외교관을 통해 합의를 이행하고, 우리 세력권 밖에 있는 영토를 넘겨 달라고 요청해 왔다.\n\n합의에 따르면 우리의 경계는 로키산맥에서 끝나며, 그곳에는 상호 합의된 중립 지대가 있다. 요구된 영토를 넘기지 않기로 한다면 곧 전쟁에 휘말릴 수도 있다."
 ksr.110.a:0 "땅을 넘겨준다. 그들은 우리의 동맹이다."
 ksr.110.b:0 "아니다. 우리에겐 다른 계획이 있다."
 
 ksr.111.t:0 "서명 당사국이 우리를 배신했다!"
 ksr.111.FROM.desc:0 "[FROM.GetNameDef]이(가) 북아메리카에서 합의된 세력권 밖의 영토를 넘기기를 노골적으로 거부한 것으로 보인다. 상대가 우리를 시험하며 우리가 물러서기를 바라는 것일 수도 있다.\n\n정당한 외교적 명분을 근거로 즉시 전쟁에 나설 수도 있고, [FROM.GetAdjective] 정부가 차지한 것을 그대로 두는 대신 우리의 합의를 무효로 할 수도 있다."
 ksr.111.a:0 "이건 말도 안 된다. 전쟁을 준비하라."
 ksr.111.b:0 "배신자들. 때를 기다리겠다."
 
 ksr.112.t:0 "협력국이 조약을 지키고 영토를 이양하다."
 ksr.112.desc:0 "[FROM.GetNameDef]의 서명 협력국이 자국 세력권 밖에 있던 북아메리카 영토를 모두 넘겨주었다.\n\n일부 고문들은 이 서면 합의의 신뢰성에 회의적이었지만, 우리의 전략적 동맹국은 믿을 만하다는 것을 증명했다... 적어도 지금은."
 ksr.112.a:0 "훌륭하다."
 
 ksr.113.t:0 "스칸디나비아 제국판무관부"
 ksr.113.desc:0 "노르웨이에 대한 초기 계획을 스칸디나비아 전역으로 확대해야 할지도 모른다. 스웨덴인은 위대한 역사에 자부심을 갖고 있고 핀란드인은 놀라운 투지를 지니고 있지만, 이제는 그들의 최대 이익이 [GER.GetNameDef]와(과) 깊이 통합된 형태로 일치할 가능성을 고려할 때다."
