l_korean:
# REPLACEMENTS AND SUPPLEMENTS FOR VANILLA
 germany.55.e:0 "보헤미아-모라비아 보호령과 위성국 슬로바키아 수립"
 germany.1002.LIT.desc:0 "베를린으로부터 현재 우리가 점령 중인 동부 폴란드 영토에 관한 외교 서신을 받았다. [GER.GetNameDef]와(과) [SOV.GetNameDef]이(가) 폴란드를 두 개의 세력권으로 나누는 이른바 비밀 몰로토프-리벤트로프 조약을 체결한 것으로 보이며, 우리의 점령이 그들의 계획에 방해가 되고 있다.\n\n[GER.GetAdjective] 정부와 [SOV.GetAdjective] 정부는 빌뉴스 지역에 대한 우리의 역사적 영유권을 인정하기로 결정했으며, 1920년부터 주장해 온 헌법상 국경 안의 영토는 계속 점령하도록 허락하겠다고 약속했다. 단, 그 국경 밖의 폴란드 영토는 모두 포기해야 한다.\n\n이를 거부한다면 머지않아 [GER.GetNameDef] 및 [SOV.GetNameDef]와(과) 전쟁을 치르게 될지도 모른다."
 LIT_events.1.d:0 "[LIT.GetLeader]이(가) [LIT.GetAdjective] 국가를 옛 수도 빌뉴스, 그리고 1920년에 주장한 국경과 다시 통합하려 한다는 것은 너무나 분명하다. 그들 혼자서는 [POL.GetNameDef]에 별 위협이 되지 않기에, [LIT.GetAdjective]인들은 [Root.GetNameDef]와(과) 함께 이 나라를 분할하려 한다. [POL.GetAdjective]령 우크라이나와 벨라루스는 [Root.GetNameDefCap]에, 빌뉴스 지역은 [LIT.GetNameDef]에 돌아가는 방식이다.\n\n물론 [POL.GetNameDefCap]은(는) 이 공동 최후통첩을 거부할 수 있으며, 그 경우 [POL.GetNameDef]와(과) [Root.GetNameDef]은(는) 전쟁 상태에 돌입하게 된다."
 LIT_events.101.d:0 "1920년 이래로 빌노는 [Root.GetNameDef]의 통제 아래 있었고, 이 도시와 그 일대를 자국의 정당한 영토로 여기는 [LIT.GetNameDef]은(는) 끊임없이 불만을 품어 왔다. 그런데 긴장이 극에 달했고, 다름 아닌 [SOV.GetLeader]의 지원을 등에 업은 리투아니아인들은 이제 동부 폴란드를 [SOV.GetAdjective]과(와) 리투아니아가 나누어 가져야 한다고 요구하고 있다. 받아들이면 동부 폴란드 전체를 내주게 되고, 거부하면 [SOV.GetAdjective]-[LIT.GetAdjective] 연합의 1순위 표적이 될 것이다."
 LIT_events.3.d:0 "지난 10년간 [Root.GetNonIdeologyName]과(와) [From.GetNonIdeologyName] 사이의 쟁점은 [From.GetNonIdeologyName]의 전통적 수도 빌뉴스에 대한 [Root.GetAdjective]의 점령이었다. 이제 두 나라가 우호적인 관계를 맺게 되자, [From.GetLeader]은(는) [Root.GetNameDef]이(가) 빌뉴스 지역의 통제권을 넘기고 [From.GetAdjective] 영토에 대한 모든 영유권 주장을 포기한다는 조건으로 영구적인 평화를 제안했다. [From.GetLeader]에 따르면 거절한다면 실망스럽겠지만, 그렇다고 [From.GetNonIdeologyName]이(가) [Root.GetNameDef]와(과) 전쟁을 벌이지는 않을 것이라고 한다."
 LIT_events.5.t:0 "[From.GetNameDefCap], 빌뉴스 지역 요구"
 LIT_events.5.a:0 "쓸모없는 땅이다. 가져가라."
 LIT_events.501.t:0 "빌뉴스 지역이 돌아왔다!"
 LIT_events.501.desc:0 "[From.GetNameDefCap]이(가) 빌뉴스 지역 영토의 평화적 반환에 동의했으며, 이는 두 나라 사이의 외교 관계 개선을 향한 한 걸음이다. 이 땅이 돌아옴으로써 리투아니아는 1920년 국경 확보에 한층 가까워졌다."
 LIT_events.502.desc:0 "예상대로 [From.GetNameDef]은(는) 빌뉴스 지역 영토를 [Root.GetNameDef]에 반환하라는 [Root.GetLeader]의 요구를 거절했다. 외교는 실패했지만 [Root.GetLeader]은(는) 아직 전쟁의 가능성을 배제하지 않았으며, 국경의 긴장이 고조되면서 전쟁은 피할 수 없어 보인다."
 south_american_events.21.desc: "[ECU.GetNameDefCap]이(가) 우리가 제안한 백색 평화에 긍정적으로 응답했다. 유감스럽게도 그 대가는 컸다. 우리는 푸투마요를 [ECU.GetAdjective] 지도부에 넘겨주었다."
 MUN_slovakia_little_war.3.t: "[1148.Getname]의 국경 충돌"
 MUN_slovakia_little_war.3.d: "$GER_first_vienna_award$에서 우리 영토를 얻고도 [HUN.getnamedef]은(는) 여전히 [1148.getname]에서 추가적인 국경 조정을 노리고 있다. 우리는 싸움 없이 땅을 내주지 않겠다는 것을 보여주기 위해 이 도전에 무력으로 맞서야 한다."
 MUN_slovakia_little_war.3.a: "감히 그들이!"








 # CUSTOM KSR EVENTS
 ksr.1.t:0 "트란스니스트리아 문제"
 ksr.1.desc:0 "현재 국방군이 우크라이나와 루마니아의 민족 경계 지대에 있는 트란스니스트리아 지역을 이루는 영토를 장악하고 있다. 이 영토는 우리에게는 별 중요성이 없지만 다른 나라들에게는 중요한 모양이다.\n\n루마니아 정부는 트란스니스트리아를 잠재적인 팽창의 전리품으로 눈독 들이고 있다.\n\n트란스니스트리아 땅을 어떻게 해야 할까?"
 ksr.1.a:0 "[ROM.GetNameDef]에 이양한다"
 ksr.1.b:0 "영토는 우리가 가진다."
 
 ksr.2.t:0 "극동의 땅"
 ksr.2.desc:0 "우리 군은 블라디보스토크-하바롭스크 지역을 이루는 땅에 대한 통제를 확고히 했다. 정부는 이 영토의 미래에 대해, 반드시 우리가 차지하지 않아도 되는 몇 가지 대안을 내놓았다.\n\n일본은 전간기 동안 우리의 전략적 동맹국이었으며, 그들은 러시아인들과 피로 얼룩진 역사를 가지고 있어 이를 청산하고 싶어 할 것이다.\n\n한편 우리 고문들은 이 영토를 향후 극동 제국판무관부의 관할 구역으로 편입하자고 제안하고 있다.\n\n블라디보스토크-하바롭스크를 어떻게 해야 할까?"
 ksr.2.a:0 "[JAP.GetNameDef]에 제안을 보낸다"
 ksr.2.b:0 "영토는 우리가 가진다."
 
 ksr.3.t:0 "사할린 문제"
 ksr.3.desc:0 "독일군이 사할린섬에 거점을 확보했지만, 이 영토는 지정학적 문제를 안고 있다. 1905년 러일 전쟁 이후 도쿄 정부는 사할린 남부를 병합했고, 섬은 수십 년 동안 둘로 나뉘어 있었다.\n\n일본은 러시아 제국과의 마지막 충돌 이후 사할린의 나머지 지역에 대한 영유권을 주장해 왔으며, 아마 이 주장을 고수하려 할 것이다.\n\n반면 우리 정부 관료들은 사할린을 향후 극동 제국판무관부의 관할 구역으로 편입해야 한다고 말한다.\n\n사할린을 어떻게 해야 할까?"
 ksr.3.a:0 "[JAP.GetNameDef]에 제안을 보낸다"
 ksr.3.b:0 "영토는 우리가 가진다."
 
 ksr.4.t:0 "[FROM.GetName], 트란스니스트리아 영토 제안"
 ksr.4.desc:0 "[FROM.GetLeader] 정부는 드네스트르강과 부크강 사이의 영토가 자신들에게 별 쓸모가 없다고 판단한 모양이다.\n\n그렇다면 우리는 1918년 루마니아 확장의 연장선에서 이 영토를 우리나라에 편입할 수 있다.\n\n이 영토를 받아들여야 할까?"
 ksr.4.a:0 "받아들이겠다."
 ksr.4.b:0 "원하지 않는다. 적어도 지금은."
 
 ksr.5.t:0 "[FROM.GetName], 영토 제안 거절"
 ksr.5.desc:0 "[FROM.GetAdjective] 정부는 이 트란스니스트리아 영토를 통치할 생각이 없는 것 같다. 그들이 밝힌 이유는 모호하지만, 나중에는 제안에 관심을 보일지도 모른다."
 ksr.5.a:0 "영토가 더 늘어나는 걸 누가 마다하나?"
 
 ksr.6.t:0 "카렐리야 북부"
 ksr.6.desc:0 "카렐리야 땅은 아주 오래전 러시아의 지배에 굴복했으며, 외국 군대가 이 땅을 밟은 것은 수 세기 만에 처음이다.\n\n[FIN.GetName]은(는) 1917년 독립 이후 줄곧 카렐리야를 눈독 들여 왔다. 이 영토를 그들에게 넘겨주면 외교 관계가 크게 개선될 것이다.\n\n한편 카렐리야는 향후 우리가 위성국 지도자들을 통해 권위를 세울 수 있는 모스크바 제국판무관부의 연장선이기도 하다.\n\n카렐리야는 누구의 것이 되어야 할까?"
 ksr.6.a:0 "[FIN.GetNameDef]에 이양한다"
 ksr.6.b:0 "영토는 우리가 가진다. 지금은."
 
 ksr.7.t:0 "[FROM.GetName], 카렐리야 영토 이양 제안"
 ksr.7.desc:0 "[FROM.GetLeader]이(가) 우리 군대를 진주시켜 카렐리야 영토를 확보하라는 외교 서신을 보내왔다.\n\n카렐리야는 [THIS.GetNameDef]의 불가분의 일부가 될 수 있지만, 잠재적으로 해로운 국제적 파장을 피하기 위해 이 결정을 신중하게 검토해야 한다.\n\n이 영토를 받아들여야 할까?"
 ksr.7.a:0 "카렐리야는 [THIS.GetNameDef]의 땅이다!"
 ksr.7.b:0 "지금은 이 영토가 필요 없다."
 
 ksr.8.t:0 "[FROM.GetName], 카렐리야 제안 거절"
 ksr.8.desc:0 "[FROM.GetCapital]에서 [FROM.GetAdjective] 정부가 카렐리야 이양 제안을 정중히 거절했다는 소식이 도착했다. 이 결정의 경위는 매우 모호하지만, 우리가 할 수 있는 일은 없다."
 ksr.8.a:0 "이게 그들의 마지막 기회였을지도 모른다."
 
 ksr.9.t:0 "[FROM.GetName], 카렐리야 제안 수락"
 ksr.9.desc:0 "양국 정부 간에 합의가 이루어졌고 행정 기관의 이양이 이미 시작되었다. [FROM.GetAdjective] 측은 이 호의에 감사를 표하며, 양국 관계 증진을 향한 결실 있는 한 걸음이라고 평가했다."
 ksr.9.a:0 "그들에게는 잘된 일이군."
 
 ksr.10.t:0 "제국의 국기"
 ksr.10.desc:0 "제국이 돌아왔고 우리는 여러 헌법적 과제에 직면해 있다. 대전쟁 이전의 모습 그대로 나라의 모든 면을 복원하는 것이 더 간단하겠지만, 몇 가지 변화를 받아들이고 싶을 수도 있다.\n\nA. 독일 제국의 공식 국기는 우리가 파시즘에 맞선 투쟁에서 다시 채택한 삼색기이며, 가장 널리 알려진 독일 국기이다.\n\nB. 독일 제국의 전쟁기는 언제나 독일의 군사력을 상징해 왔으며 우리의 진정한 자부심과 역사를 대변한다.\n\nC. 1848년의 옛 전쟁기는 1871년 실제 통일보다 훨씬 앞서 독일 제국을 세우려 했던 최초의 시도를 상징한다.\n\nD. 제국 삼색기를 그대로 두되, 가운데에 우리 문장을 넣을 수 있다.\n\n새로운 독일 제국은 어떤 국기를 택해야 할까?"
 ksr.10.a:0 "A. 제국 삼색기."
 ksr.10.b:0 "B. 제국 전쟁기."
 ksr.10.c:0 "C. 옛 제국 전쟁기."
 ksr.10.d:0 "D. 문장이 들어간 제국기."
 
 ksr.11.t:0 "제국의 국기"
 ksr.11.desc:0 "수 세기에 걸친 러시아의 역사는 현재의 삼색기로 상징되지만, 공산주의자와 그 동조자들이 조국에서 추방되면서 새로운 장이 쓰이고 있다. 크렘린 관리들이 검토할 만한 새 국기 안을 몇 가지 내놓았다.\n\nA. 단순한 삼색기는 대전쟁 이전부터 쓰였으며, 러시아 제국의 마지막 공식 국기로서 그대로 유지할 수 있다.\n\nB. 캔턴이 들어간 삼색기는 러시아가 대전쟁에서 승리할 경우를 대비해 제안되었던 제국 국기로, 끝내 실현되지 못했다.\n\nC. 흑금백 삼색기는 1858년 차르 알렉산드르 2세가 직접 채택하여 그 세기 대부분 동안 사용되었다.\n\nD. 흑금백 국기 가운데에 황제기를 넣어 새로 만들 수 있다. 이는 이전에 공식적으로 쓰인 적이 없는 완전히 새로운 국기가 될 것이다.\n\n새로 재건된 러시아 제국은 어떤 국기를 채택해야 할까?"
 ksr.11.a:0 "A. 현재 국기를 유지한다."
 ksr.11.b:0 "B. 제국 문장이 들어간 계획안 삼색기."
 ksr.11.c:0 "C. 흑금백기."
 ksr.11.d:0 "D. 황제기가 들어간 흑금백기."
 
 ksr.12.t:0 "제국의 수도"
 ksr.12.desc:0 "1918년 오스트리아-헝가리가 해체되면서 저마다의 길을 가고자 하는 수많은 분리 국가들이 생겨났지만, 빈의 합스부르크 가문이 강하게 움켜쥐고 있던 시절에는 결코 불가능한 일이었다. 그들의 권력은 명성에 걸맞았다.\n\n정부를 합스부르크 가문이 있는 곳으로 옮겨야 할까, 아니면 수도를 지금 그대로 두어야 할까?"
 ksr.12.a:0 "수도를 빈으로 옮긴다!"
 ksr.12.b:0 "불필요한 변화다."
 
 ksr.13.t:0 "[FROM.GetName], 남윌란 요구"
 ksr.13.desc:0 "[FROM.GetLeader] 정부가 남윌란 영토를 싸우지 않고 넘겨주지 않으면 무력으로 빼앗겠다는 우려스러운 외교 서신을 보내왔다.\n\n남윌란은 1919년 베르사유 조약으로 독일 제국에서 떨어져 나와 덴마크에 귀속되었으며, [FROM.GetLeader]은(는) 이제 옛 독일 영토를 되찾으려는 것으로 보인다.\n\n남윌란을 넘겨줄 것인가, 아니면 전쟁을 무릅쓸 것인가?"
 ksr.13.a:0 "[FROM.Adjective] 측의 요구를 받아들인다."
 ksr.13.b:0 "단 1센티미터도 물러서지 않겠다."
 
 ksr.14.t:0 "[FROM.GetName], 남윌란 이양"
 ksr.14.desc:0 "[FROM.capital.GetCapitalVictoryPointName]에 있는 우리 외교 공관에서 [FROM.GetAdjective]군이 남윌란의 모든 거점에서 철수하고 있다는 반가운 소식을 전해 왔다.\n\n[FROM.GetNameDef]와(과)의 영토 분쟁은 당분간 해결된 것으로 보인다."
 ksr.14.a:0 "베르사유 조약은 무효다."
 
 ksr.15.t:0 "[FROM.GetName], 남윌란 이양 거부"
 ksr.15.desc:0 "[FROM.GetNameDef] 정부가 남윌란 반환을 거부하며 우리의 엄포에 꽤나 대담하게 맞선 것으로 보인다. 유감스럽게도 남은 선택지는 무력으로 영토를 되찾는 것뿐이며, 그렇게 한다면 굳이 남윌란에서 멈출 필요도 없을 것이다."
 ksr.15.a:0 "이것이 그들의 마지막 실수다."
 
 ksr.16.t:0 "[FROM.GetNameDef]의 국기"
 ksr.16.desc:0 "1918년에 무너진 옛 오스트리아-헝가리 제국은 행정적으로 다양한 나라였다. 이를 나타내는 여러 깃발이 쓰였지만, 국제적 용도로 우리가 쓸 수 있는 것은 하나뿐이다.\n\nA. 제국의 옛 상선기를 유지할 수 있다. 이 깃발의 가장 두드러진 특징은 나라의 가장 중요한 두 구성체인 오스트리아와 헝가리를 분명하게 표현한다는 점이다.\n\nB. 같은 상선기에 두 나라의 공식 문장을 넣어 더 정교한 깃발을 만들 수 있다.\n\nC. 흑금 깃발은 합스부르크 가문의 고전적이고 매우 오래된 깃발이다. 20세기 초 제국이 무너질 때까지 널리 쓰였다.\n\nD. 문장이 들어간 합스부르크 깃발은 같은 흑금 깃발에 합스부르크 가문의 소문장을 넣은 것이다. 이 깃발은 수백 년을 이어 온 우리 왕조의 권력과 영향력을 나타내는 데 쓰일 수 있다.\n\n[FROM.GetNameDef]은(는) 어떤 국기를 채택해야 할까?"
 ksr.16.a:0 "A. 현재 국기를 유지한다."
 ksr.16.b:0 "B. 국가 상선기."
 ksr.16.c:0 "C. 합스부르크 깃발."
 ksr.16.d:0 "D. 제국 문장이 들어간 합스부르크 깃발."
 
 ksr.17.t:0 "[FROM.GetName], 블라디보스토크-하바롭스크 영토 제안"
 ksr.17.desc:0 "[FROM.GetNameDef]의 [FROM.GetLeader] 정부가 대사를 통해 일방적인 제안이 담긴 외교 서신을 보내왔다.\n\n그들은 블라디보스토크-하바롭스크 지역의 영토를 통제하느라 보급선이 늘어지고 병참 문제가 생겨 점령이 골칫거리가 되었다고 보고 있다. 그래서 [FROM.GetAdjective] 정부는 더 나은 외교 관계를 대가로 이 영토를 우리에게 넘기는 것이 올바른 선택이라고 판단했다.\n\n제안을 받아들여 블라디보스토크-하바롭스크 영토를 넘겨받아야 할까?"
 ksr.17.a:0 "그렇다. 이 영토가 필요하다."
 ksr.17.b:0 "관심 없다."
 
 ksr.18.t:0 "[FROM.GetName], 블라디보스토크-하바롭스크 제안 거절"
 ksr.18.desc:0 "예상치 못하게 [FROM.GetAdjective] 측은 지금으로서는 이 땅에 관심이 없다며 우리의 제안을 정중히 거절했다."
 ksr.18.a:0 "다른 쓸 곳을 찾아보자."
 
 ksr.19.t:0 "[FROM.GetName], 사할린 제안"
 ksr.19.desc:0 "[ROOT.GetNameDef] 주재 [FROM.GetAdjective] 대사관으로부터 사할린섬의 땅을 우리나라와 다시 합치자는 제안이 담긴 외교 서신을 받았다. 이 지역에 대한 우리의 역사적 영유권을 알고 있는 [FROM.GetNameDef]은(는) 더 나은 외교 관계를 대가로 이 영토를 우리에게 넘길 용의가 있다.\n\n이 영토를 받아들일까, 아니면 대사에게 관심이 없다고 전할까?"
 ksr.19.a:0 "사할린은 우리 것이다!"
 ksr.19.b:0 "지금은 관심 없다."
 
 ksr.20.t:0 "[FROM.GetName], 사할린 제안 거절"
 ksr.20.desc:0 "[FROM.GetAdjective] 정부가 아직 섬을 통제할 준비가 되지 않았다며 사할린 제안을 뜻밖에 거절했다. 그래도 호의에는 감사를 표했다."
 ksr.20.a:0 "자기들이 영유권을 주장하지 않았던가?"
 
 ksr.21.t:0 "[FROM.GetName], 이양 제안 수락"
 ksr.21.desc:0 "[FROM.GetNameDef]의 지도자 [FROM.GetLeader]이(가) 영토를 넘겨준 데 대해 공식적으로 감사를 표했으며, 그들은 현재 행정적으로 이 영토를 인수하는 중이다.\n\n이것이 [THIS.GetAdjective]-[FROM.GetAdjective] 외교 및 국가 관계에 긍정적인 전환점이 되기를 바란다."
 ksr.21.a:0 "그들에게는 잘된 일이군."
 
 ksr.22.t:0 "북아메리카 분할 계획"
 ksr.22.GER.desc:0 "우리 군은 북아메리카 영토 일부를 확보하는 큰 성과를 거두었다. 이 최근의 정복을 계기로 정부는 야심 찬 비밀 계획을 구상했다.\n\n최고위 관료와 장군들이 모여, 현재 주로 미국과 캐나다 땅을 대상으로 북아메리카를 우리와 일본이 나누어 갖는 계획을 제안했다.\n\n이 제안에는 국경 분쟁을 피하기 위해 로키산맥에 서로 손대지 않기로 하는 출입 금지 중립 지대를 설정하는 내용이 담겨 있다.\n\n독일은 로키산맥 동쪽 영토를, 일본은 산맥 서쪽의 모든 지역을 장악하게 된다.\n\n이 제안을 [JAP.GetNameDef]의 잠재적 협력자들에게 보내야 할까?"
 ksr.22.JAP.desc:0 "우리 군은 북아메리카 영토 일부를 확보하는 큰 성과를 거두었다. 이 최근의 정복을 계기로 정부는 야심 찬 비밀 계획을 구상했다.\n\n최고위 관료와 장군들이 모여, 현재 주로 미국과 캐나다 땅을 대상으로 북아메리카를 우리와 독일이 나누어 갖는 계획을 제안했다.\n\n이 제안에는 국경 분쟁을 피하기 위해 로키산맥에 서로 손대지 않기로 하는 출입 금지 중립 지대를 설정하는 내용이 담겨 있다.\n\n독일은 로키산맥 동쪽 영토를, 일본은 산맥 서쪽의 모든 지역을 장악하게 된다.\n\n이 제안을 [GER.GetNameDef]의 잠재적 협력자들에게 보내야 할까?"
 ksr.22.a:0 "그렇다, 당연하지!"
 ksr.22.b:0 "아니다. 우리에겐 다른 계획이 있다."
 KSR_is_neutral_zone_american_state_tt:0 "독일-일본 북아메리카 분할 대상 주입니다."
 
 ksr.23.t:0 "[FROM.GetName], 북아메리카 분할 계획 제안"
 ksr.23.desc:0 "[FROM.GetAdjective] 대사관이 우리 정부 최고위층에 외교관을 보내 북아메리카를 두 나라가 나누어 갖는 계획을 제안했다.\n\n이 제안에는 국경 분쟁을 피하기 위해 로키산맥에 서로 손대지 않기로 하는 출입 금지 중립 지대를 설정하는 내용이 담겨 있다.\n\n독일은 로키산맥 동쪽 영토를, 일본은 산맥 서쪽의 모든 지역을 장악하게 된다.\n\n[FROM.GetAdjective] 정부가 보낸 이 제안에 동의해야 할까?"
 ksr.23.a:0 "그렇다. 훌륭한 생각이다."
 ksr.23.b:0 "아니다. 그들을 믿을 수 없다."
 
 ksr.24.t:0 "[FROM.GetName], 북아메리카 분할 계획에 동의"
 ksr.24.desc:0 "[FROM.GetName]의 협력자들은 이 제안을 듣고 매우 기뻐하며 흔쾌히 동의한 것으로 보인다.\n\n다만 우리는 의무를 지키고 세력권을 존중해야 하며, 중립 지대가 설정되면 그 영토 또한 존중해야 한다."
 ksr.24.a:0 "북아메리카는 우리 것이다!"
 
 ksr.25.t:0 "[FROM.GetName], 북아메리카 분할 계획 거부"
 ksr.25.desc:0 "[FROM.GetAdjective] 대표단이 자국 정부가 북아메리카 분할 계획을 거부한다는 유감스러운 소식을 전해 왔다."
 ksr.25.a:0 "좋다. 우리가 직접 차지하겠다."
 
 ksr.26.t:0 "[1148.GetName] 이양"
 ksr.26.desc:0 "소브란체는 카르파티아산맥에 있는 작은 땅으로, 헝가리인들이 한동안 눈독 들여 온 곳이다. 이 영토는 우리에게 별 쓸모가 없으며, 이를 [HUN.GetNameDef]에 제안하면 관계가 개선될 가능성이 높다.\n\n[1148.GetName]을(를) 어떻게 해야 할까?"
 ksr.26.a:0 "[HUN.GetNameDef]에 제안을 보낸다."
 ksr.26.b:0 "우리가 가지고 있겠다."
 
 ksr.27.t:0 "[FROM.GetName], [1148.GetName] 제안"
 ksr.27.desc:0 "[FROM.GetAdjective] 정부가 작은 지방 [1148.GetName]을(를) 넘겨주겠다는 메시지를 전해 왔다. 이곳은 수백 년 동안 우리 영토였으며, 제안한 측은 이를 더 나은 외교 관계를 위한 호의로 여기고 있다.\n\n이 이양을 받아들여야 할까?"
 ksr.27.a:0 "물론이다!"
 ksr.27.b:0 "그들이 가지라고 해."
 
 ksr.28.t:0 "[FROM.GetName], 이양 제안 거절"
 ksr.28.desc:0 "[FROM.GetAdjective] 정부가 영토 이양 제안을 정중히 거절하는 외교 서신을 보내왔다. 분명한 이유는 밝히지 못했지만, 그래도 호의에는 감사를 표했다."
 ksr.28.a:0 "그들의 손해지."
 
 ksr.29.t:0 "[ROOT.GetNameDef]의 국기"
 ksr.29.desc:0 "최근 [ROOT.GetNameDef]이(가) 부활하면서 국가의 공식 상징을 두고 정부 내에서 많은 논의가 벌어졌다. 특히 1795년 폴란드-리투아니아 연방의 마지막 시기에도 이 공화국은 오늘날 기준의 국기를 쓰지 않았기 때문이다. 관료들이 새 국기 안을 몇 가지 내놓았다.\n\nA. 연방의 옛 군기 색 구성을 유지하되, 1863년 1월 봉기 때 쓰인 폴란드-리투아니아-루테니아 세 부분 연합 문장으로 이루어진 새 방패를 채택한다.\n\nB. 지난 세기 1월 봉기 때 쓰인 깃발을 복원하되, 원래는 쓰이지 않았던 왕관을 세 부분 방패 위에 얹는다.\n\nC. 독수리와 비티스로 이루어진 옛 역사적 방패를 적-백-적 색 구성으로 되돌리고, 옛 군기의 비율을 본떠 중앙에서 약간 왼쪽으로 치우치게 배치한다.\n\nD. 앞의 안과 매우 비슷하지만, 같은 독수리와 비티스 조합을 쓴 더 정교한 역사적 방패를 사용한다.\n\n새로운 [ROOT.GetNameDef]은(는) 어떤 국기를 채택해야 할까?"
 ksr.29.a:0 "A. 봉기 방패가 들어간 적-백-적기."
 ksr.29.b:0 "B. 왕관이 들어간 봉기 깃발."
 ksr.29.c:0 "C. 중앙에서 벗어난 역사적 방패가 들어간 적-백-적기."
 ksr.29.d:0 "D. 중앙에서 벗어난 정교한 역사적 방패가 들어간 적-백-적기."
 
 ksr.30.t:0 "한반도 분할 계획"
 ksr.30.desc:0 "[JAP.GetNameDef]와(과)의 전쟁은 막대한 대가를 치르고 있지만, 이 전쟁이 끝난다고 해서 아시아에서 제국주의적 정복이 끝나는 것은 아닐지도 모른다. 우리 고문들은 공산주의자들이 한반도를 포함한 대륙 전체를 장악할 준비를 하고 있다고 우려한다.\n\n한국인들은 오랫동안 일본의 잔혹한 지배 아래 살아왔지만, 억압적일 수 있는 공산 정권 아래에서도 이 민족의 상황이 나아지지 않을 수 있다. 고문들은 적어도 한반도 남쪽 절반만큼은 공산주의의 확산을 막는 계획을 권고하고 있다. 한반도 전체보다는 협상하기가 더 쉬울 것이다.\n\n가장 이상적인 계획은 고통스러운 국경 협상을 피하기 위해 간단히 38선을 따라 한반도를 나누는 것이다. 적의 적에게 제안을 보내 한반도 분할을 협상해야 할까?"
 ksr.30.a:0 "그들에게 이 제안을 보낸다."
 ksr.30.b:0 "두 개의 한국은 원하지 않는다."
 
 ksr.31.t:0 "한반도 분할 계획"
 ksr.31.desc:0 "미국인들이 제안을 들고 나왔다. 그들은 일본 제국주의자들로부터 해방된 후 한반도를 38선을 따라 나누고, 북쪽을 우리에게 넘기겠다고 한다.\n\n그들은 혁명의 확산을 우려하는 것으로 보이며, [USA.GetNameDef]이(가) 우리의 이념적 적이라는 사실을 잊어서는 안 된다. 그러나 한반도 전체를 우리가 차지하면 [JAP.GetNameDef]에 맞선 공동 투쟁의 전과를 균형 있게 나눈다는 측면에서 문제가 생길 수 있다. 말할 것도 없이 미국인들은 이 문제로 우리와 전쟁을 벌일지도 모른다.\n\n이 제안을 받아들이면 우리는 38선 이남의 모든 영토를 미군 점령 당국에 넘겨야 하며, 그들 역시 이북의 모든 영토를 우리에게 넘겨야 한다. 어떻게 해야 할까?"
 ksr.31.a:0 "받아들인다. 양측 모두에게 공평한 일이다."
 ksr.31.b:0 "아니다. 한반도 전체를 해방할 것이다!"
 
 ksr.32.t:0 "한반도 분할 계획"
 ksr.32.desc:0 "공산주의자들이 분할 계획을 받아들였다. 우리가 이북의 모든 영토를 넘겨야 하듯, 그들도 이남의 모든 영토를 우리에게 넘길 의무를 진다."
 ksr.32.a:0 "남한은 안전하다!"
 
 ksr.33.t:0 "한반도 분할 계획"
 ksr.33.desc:0 "협상이 결렬되었다! [FROM.GetNameDef]은(는) 계획을 거절했으며, 그들이 한반도의 일부를 통제하고 있으므로 협상에서 그들을 배제할 수도 없다. 이 전쟁이 1년 더 이어진다면 다시 시도해 볼 수 있을 것이다.\n\n지금으로서는 한반도의 운명은 아무도 알 수 없다."
 ksr.33.a:0 "이 무슨 낭비란 말인가..."
 
 ksr.34.t:0 "한반도 분할 계획"
 ksr.34.desc:0 "현재 우리는 38선 이북 한반도 영토의 일부 또는 전부를 완전히 통제하고 있다. 공산주의자들과의 합의에 따라 우리는 이 영토를 그들에게 넘겨야 한다."
 ksr.34.a:0 "상황이 바뀌었다. 그들에게 넘기지 않겠다."
 ksr.34.b:0 "넘겨준다. 우리는 약속을 지킨다."
 
 ksr.35.t:0 "한반도 분할 계획"
 ksr.35.desc:0 "[FROM.GetName]이(가) 38선 이북의 모든 한반도 영토를 우리의 직접 통치 아래 넘겨주었다. 미국인들은 합의를 지키고 있는 것으로 보인다."
 ksr.35.a:0 "훌륭하다."
 
 ksr.36.t:0 "한반도 분할 계획"
 ksr.36.desc:0 "[FROM.GetName]이(가) 38선 이북의 모든 한반도 영토를 우리의 직접 통치 아래 넘기기를 거부했다. 이는 합의 위반이며 군사 행동의 명분이 된다."
 ksr.36.a:0 "필요하다면 무력을 쓰겠다."
 
 ksr.37.t:0 "한반도 분할 계획"
 ksr.37.desc:0 "현재 우리는 38선 이남 한반도 영토의 일부 또는 전부를 완전히 통제하고 있다. 미국인들과의 합의에 따라 우리는 이 영토를 그들에게 넘겨야 한다."
 ksr.37.a:0 "상황이 바뀌었다. 그들에게 넘기지 않겠다."
 ksr.37.b:0 "넘겨준다. 우리는 약속을 지킨다."
 
 ksr.38.t:0 "한반도 분할 계획"
 ksr.38.desc:0 "[FROM.GetName]이(가) 38선 이남의 모든 한반도 영토를 우리의 직접 통치 아래 넘겨주었다. 공산주의자들은 합의를 지키고 있는 것으로 보인다."
 ksr.38.a:0 "훌륭하다."
 
 ksr.39.t:0 "한반도 분할 계획"
 ksr.39.desc:0 "[FROM.GetName]이(가) 38선 이남의 모든 한반도 영토를 우리의 직접 통치 아래 넘기기를 거부했다. 이는 합의 위반이며 군사 행동의 명분이 된다."
 ksr.39.a:0 "필요하다면 무력을 쓰겠다."
 
 ksr.40.t:0 "[SIA.GetNameDef]의 국호를 타이로 변경"
 ksr.40.desc:0 "시암은 위대한 역사를 지니고 있다. 이 나라는 이 지역 전체에서 유일하게 서구 열강의 식민지가 되지 않은 나라다. 1932년 혁명 이후 점점 더 많은 타이인들이 조국에 대한 애국심을 품게 되었다. 우리는 여기서 한 걸음 더 나아갈 수 있다.\n\n고문들은 [SIA.GetNameDef]의 국호를 '자유인의 땅'을 뜻하는 타이로 바꾸자는 생각을 열렬히 지지하고 있다. 타이 사람들이 진정 그러하기 때문이다."
 ksr.40.a:0 "민족, 종교, 그리고 국왕을 위하여."
 
 ksr.41.t:0 "[1385.GetName]와(과) [1386.GetName] 이양"
 ksr.41.desc:0 "폴란드의 작은 주인 [1385.GetName]와(과) [1386.GetName]은(는) 1920년대 초 체코슬로바키아인들과 분쟁을 벌였던 곳이며, 역사 지도에서는 대전쟁 시기 옛 헝가리 왕국의 경계 안에 들어 있다.\n\n이 지역들은 우리에게는 하찮지만, [71.OWNER.GetAdjective] 동맹국에게는 상징적인 가치가 있어 관계를 한층 개선할 수 있을 것이다.\n\n이 영토의 일부를 [71.OWNER.GetNameDef]에 이양해야 할까?"
 ksr.41.a:0 "[71.OWNER.GetNameDef]에 제안한다"
 ksr.41.b:0 "당분간 우리가 가지고 있겠다."
 
 ksr.42.t:0 "[FROM.GetName], 남부 폴란드 영토 제안"
 ksr.42.desc:0 "[GER.GetAdjective] 외교관들이 [1385.GetName]와(과) [1386.GetName] 일대의 일부 영토를 우리에게 넘기겠다는 제안을 가지고 찾아왔다. 이 영토는 대전쟁이 끝나기 전까지 우리 왕국에 속해 있었으므로 어느 정도 역사적 정당성이 있다.\n\n이 제안을 받아들여야 할까?"
 ksr.42.a:0 "물론이다!"
 ksr.42.b:0 "이 땅은 필요 없다."
 
 ksr.43.t:0 "[FROM.GetName], 영토 제안 거절"
 ksr.43.desc:0 "[FROM.GetAdjective] 정부는 지금으로서는 우리의 제안에 관심이 없는 것 같다."
 ksr.43.a:0 "그들의 손해지."
 
 ksr.44.t:0 "검열되지 않은 §RNSDAP§! 상징"
 ksr.44.desc:0 "호스트의 게임 규칙에 따라 검열되지 않은 독일 NSDAP 상징이 활성화되었으며 곧 적용됩니다.\n\n공개 검열법에 저촉되는 것을 원하지 않는다면, 게임에서 나가거나 게임 규칙에서 '검열되지 않은 NSDAP 상징' 설정을 끈 상태로 게임을 다시 시작하세요.\n\n§R참고:§! 멀티플레이의 경우 모든 플레이어가 이 안내를 확인하면 상징이 활성화됩니다."
 ksr.44.a:0 "확인"
 
 ksr.45.t:0 "몽골인들, 일본 육군의 승인 아래 자치를 요청하다"
 ksr.45.desc:0 "미나미 지로 장군이 도쿄에 보고하기를, 현지 협력자인 덕왕이 중국 차하르성에서 [JAP.GetAdjective] 군의 감독을 받는, 우리에게 충성스러운 몽골 군정부를 세울 준비가 되어 있다고 한다. 이렇게 하면 우리의 직접 통치는 느슨해지지만, 내몽골에서 반국민당 정서가 자라날 기회가 생긴다. 유용한 동맹국이 될 잠재력이 크다.\n\n거부한다면 일본 제국 육군은 장기적으로 차하르의 안정을 유지하는 데 어려움을 겪을 수 있다. 게다가 미나미 장군과 육군 전체의 권위가 무시당했다고 여겨져 육군과 해군 사이의 골이 더 깊어질 것이다.\n\n[JAP.GetNameDef]에 충성하는 몽골 자치 군정부를 세워야 할까?"
 ksr.45.a:0 "그렇다. 몽골인은 우리의 동맹이다."
 ksr.45.b:0 "아니다. 대신 차하르를 만주에 이양한다."
 ksr.45.c:0 "아니다. 몽골인에 대한 장악력을 늦출 수 없다."
 
 ksr.46.t:0 "[FROM.GetName], 차하르를 만주에 이양"
 ksr.46.desc:0 "[FROM.GetAdjective] 정부가 옛 중국 차하르성을 우리에게 넘기는 것이 적절하다고 판단했다. 현지 몽골인들이 자치를 얻으려 했지만, 우리의 종주국은 이미 우리가 통제하고 있는 내몽골의 나머지 지역과 이들을 통합해야 한다고 결정한 것으로 보인다."
 ksr.46.a:0 "받아들이겠다."
 
 ksr.47.t:0 "보헤미아-모라비아 보호령"
 ksr.47.desc:0 "체코인들은 우리와 밀접하게 연결되어 있지만, 이 역사적인 슬라브 이웃들에게는 자치가 필요할 수도 있다. [RBM.GetLeader]은(는) [GER.GetNameDef]와(과) 협력하여 보헤미아와 모라비아 땅의 통치를 도울 준비가 되어 있다."
