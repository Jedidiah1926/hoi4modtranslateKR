 ksr.132.desc:0 "오스트리아-헝가리는 민족적으로뿐 아니라 행정적으로도 매우 다양한 제국이었다. 합스부르크 제국 말기에 보스니아는 특별한 자치를 누렸다. 보스니아인들이 그늘에 가려지지 않도록 이를 되살리는 것을 고려해 볼 만하다."
