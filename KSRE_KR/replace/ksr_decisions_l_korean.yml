 #KSR
 KSR_demand_hultschiner_landchen: "훌치너 렌트헨 문제"
 KSR_demand_hultschiner_landchen_desc: "훌치너 렌트헨은 1920년 우리에게서 떨어져 나가 체코슬로바키아에 넘어갔다. 하찮아 보일지 모르지만 이곳은 여전히 옛 제국의 영토이며, 우리는 실레지아에서의 영토적 입지를 고려해야 한다."
 
 KSR_state_transfer_cat: "영토 분쟁"
 KSR_state_transfer_cat_desc: "우리와 다른 나라들 사이에 분쟁의 대상이 되어 온 영토가 있다. 어떤 식으로든 우리에게 이익이 되는 해결책을 찾기 위해 추가 조치를 취할 수 있다."
 
 KSR_form_grand_duchy_lithuania_cat: "대공국 부활"
 KSR_form_grand_duchy_lithuania_cat_desc: "리투아니아가 유럽에서 영토가 가장 넓은 나라였던 시절이 있었다. 과거의 진정한 영광은 수많은 슬라브인을 다스렸던, 강력하고 호전적인 발트계 리투아니아 부족이 이끈 두 바다 사이의 제국으로 거슬러 올라간다. 어쩌면 우리는 루테니아인들을 다시 한번 우리 품으로 데려올 수 있을 것이다."
 KSR_form_grand_duchy_lithuania: "리투아니아 대공국 재건"
 
 LIT_move_capital_to_vilnius_desc: "빌뉴스가 다시 우리의 법적 통제 아래 들어왔다. 이곳은 우리의 전통적인 수도이자 헌법에 명시된 수도이므로, 즉시 정부를 그곳으로 복귀시켜야 한다."
 LIT_move_capital_to_kaunas: "임시 수도를 카우나스로 이전"
 LIT_move_capital_to_kaunas_desc: "빌뉴스는 더 이상 우리의 통제 아래 있지 않다. 리투아니아 정부가 계속 기능하도록 하려면 두 번째로 중요한 도시에 정부를 세워야 한다."
 
