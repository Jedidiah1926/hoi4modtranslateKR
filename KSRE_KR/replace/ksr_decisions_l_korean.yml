 #Formables
 ksr_form_new_england_cat: "뉴잉글랜드"
 ksr_form_new_england_cat_desc: "뉴잉글랜드의 역사는 필그림들로 거슬러 올라간다. 그들이 1620년 첫 정착지를 세웠을 때 이 지역은 아메리카로 들어가는 관문 중 하나가 되었다. 문화, 경관, 뿌리를 공유하는 만큼 뉴잉글랜드 통일을 고려해 볼 만하다."
 ksr_form_new_england: "뉴잉글랜드 수립"
 ksr_form_new_england_prq1: "§Y코네티컷, 메인, 매사추세츠, 뉴햄프셔, 로드아일랜드§!와 §Y버몬트§!의 초기 영토를 보유하고 완전히 통제합니다."
 ksr_form_new_england_eff1: "§Y코네티컷, 메인, 매사추세츠, 뉴햄프셔, 로드아일랜드§!와 §Y버몬트§!의 모든 초기 영토에 코어를 얻습니다."
 ksr_form_new_england_capital_boston: "[1743.GetCapitalVictoryPointName](으)로 수도 이전"
