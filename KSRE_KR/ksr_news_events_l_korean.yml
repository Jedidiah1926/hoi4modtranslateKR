l_english:
 #KSR 1.0.0
 ksr_news.1.t:0 "[LIT.GetName]의 귀환"
 ksr_news.1.desc:0 "14세기, 위대한 전설이었던 알기르다스 대공은 동유럽을 휩쓸었다. 군대를 이끌고 모스크바를 여러 차례 포위한 알기르다스는 역사상 가장 큰 리투아니아 국가를 세운 인물로 역사에 이름을 남겼다. 작은 발트계 리투아니아 부족이 다스렸음에도 이 국가는 러시아의 전신인 모스크바 대공국의 직접적인 경쟁자였다. 리투아니아 대공국은 결국 1795년 러시아에 흡수되었다.\n\n빌뉴스에 대공 정부가 돌아오자, 많은 이들은 리투아니아인들이 다시 한번 동유럽 슬라브인들에 대한 지배를 되찾으려 한다고 믿고 있다. 그들이 앞으로 어디까지 나아갈지는 아무도 모른다."
 ksr_news.1.a:0 "강철 늑대의 전설이여 영원하라."
 ksr_news.1.b:0 "그들에게 폴란드가 왜 필요하겠나?"
 ksr_news.1.c:0 "그들은 다시 흡수될 것이다."
 
 ksr_news.2.t:0 "[LIT.GetNameDef], 빌뉴스 통제권 회복"
 ksr_news.2.desc:0 "오늘 [LIT.GetLeader]은(는) 마침내 조국의 품으로 돌아온 빌뉴스 시민들에게 축하를 전했다. 정부는 이미 모든 주요 기관을 이 도시로 다시 옮길 준비를 시작했다.\n\n리투아니아는 1920년 젤리고프스키가 이끄는 폴란드군의 진격으로 역사적이자 법적인 수도였던 빌뉴스를 잃었다. 그 이후 빌뉴스와 그 주변 지역은 분쟁 지역이 되었고, 수 세기 만에 최악의 폴란드-리투아니아 관계를 낳았다.\n\n이것이 리투아니아인과 폴란드인 사이의 관계에 어떤 영향을 미칠지는 불확실하지만, 분석가들에 따르면 동유럽의 국경이 다시 그어지는 일은 이번이 마지막이 아닐 가능성이 높다."
 ksr_news.2.a:0 "게디미나스 대공의 도시가 돌아왔다."
 ksr_news.2.b:0 "우리는 빌노를 잊지 않을 것이다."
 ksr_news.2.c:0 "그들에게는 잘된 일이군."
 
 ksr_news.3.t:0 "[KOR.GetName], 독립 선언"
 ksr_news.3.desc:0 "오늘 [KOR.GetLeader]은(는) [KOR.capital.GetCapitalVictoryPointName]에 모인 수많은 환호하는 군중 앞에서 한반도에 새로 수립된 독립 국가 [KOR.GetNameDef]의 탄생을 선포했다. 미국 정부의 지지를 받은 한국인들은 이전 통치자들의 안전 보장 아래 마침내 완전한 주권을 획득했다. 온 나라가 일본 제국주의자들의 가혹한 점령에서 벗어난 것을 기뻐하고 있다.\n\n한국인들이 민족의 놀라운 정치적 승리를 축하하는 가운데, 민주주의 세계의 지도자들 사이에서는 새로 수립된 [KOR.GetNameDef]이(가) 여전히 외세의 영향력과 팽창에 취약하다는 우려가 커지고 있다."
 ksr_news.3.a:0 "한국의 새로운 새벽이다!"
 ksr_news.3.b:0 "그들에게는 보호가 필요하다..."
 
 ksr_news.4.t:0 "조선민주주의인민공화국, 독립 선언"
 ksr_news.4.desc:0 "오늘 [DPK.GetLeader]은(는) 동포들에게 애국적인 연설을 하는 한편, 외국 공산주의 외교관들에게 강력한 메시지를 보냈다. 이제 [DPK.GetNameDef]이(가) 세계 마르크스주의 운동에 합류한다는 것이다. 강력한 외국 군정의 감독 아래, [DPK.GetLeader]은(는) 새로운 공산주의 국가로 한국 노동자들을 다스릴 만큼의 신임을 얻는 데 성공했다.\n\n불충한 반체제 인사와 그 밖의 비동맹 정치 활동가들이 구금되고 있다는 우려스러운 보도가 이미 나오고 있지만, 옛 점령 지역의 한국 인민들은 서서히 공산주의 통치를 받아들이기 시작하고 있다. [DPK.GetLeader]이(가) 강력한 공산주의 지도자가 될지는 두고 볼 일이다."
 ksr_news.4.a:0 "한국 노동자들이 혁명에 합류했다!"
 ksr_news.4.b:0 "한 압제 정권에서 또 다른 압제 정권으로."
 
 ksr_news.5.t: "[FROM.GetNameDef] 수립"
 ksr_news.5.desc: "[FROM.GetLeader]은(는) [FROM.CAPITAL.GetCapitalVictoryPointName]에서 환호하는 군중에게 뉴잉글랜드 지역이 이제 하나의 국가로서, 코네티컷, 메인, 매사추세츠, 뉴햄프셔, 로드아일랜드, 버몬트의 원래 6개 주 모두를 대표하는 강력한 단일 국가로 서게 될 것이라고 선포했다.\n\n[FROM.CAPITAL.GetCapitalVictoryPointName]의 주요 거리는 이제 이 나라의 아름다운 자연과 경관을 상징하는 뉴잉글랜드 나무 깃발로 뒤덮였다. 1620년 최초의 필그림 정착지 이래로 뉴잉글랜드는 연방의 다른 지역과 비교해 독특하고 유럽적인 문화 지역이었다. 탄탄한 교육, 산업, 해양 역량을 갖춘 뉴잉글랜드의 미래는 밝아 보인다."
 ksr_news.5.a: "자유가 이보다 반가운 적은 없었다."
 ksr_news.5.b: "필그림들이 행복하겠군."
 ksr_news.5.c: "우리의 적이 새 단장을 한다고?"